x-redash-service: &redash-service
  image: redash/redash:__TAG__
  depends_on:
    - postgres
    - redis
  env_file: /opt/redash/env
  restart: always
services:
  server:
    <<: *redash-service
    command: server
    ports:
      - "5000:5000"
    environment:
      REDASH_WEB_WORKERS: 4
  scheduler:
    <<: *redash-service
    command: scheduler
    depends_on:
      - server
  scheduled_worker:
    <<: *redash-service
    command: worker
    depends_on:
      - server
    environment:
      QUEUES: "scheduled_queries,schemas"
      WORKERS_COUNT: 1
  adhoc_worker:
    <<: *redash-service
    command: worker
    depends_on:
      - server
    environment:
      QUEUES: "queries"
      WORKERS_COUNT: 2
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  postgres:
    # pgautoupgrade handles automatic PostgreSQL major version upgrades.
    #
    # [NOTE FOR EXISTING USERS]
    # If upgrading from PG17 or earlier, the volume mount path has changed.
    # Backup your data first, then stop containers and update your volume from:
    #   /opt/redash/postgres-data:/var/lib/postgresql/data
    # to:
    #   /opt/redash/postgres-data:/var/lib/postgresql
    #
    # pgautoupgrade will automatically migrate your data to the new directory structure.
    #
    # Details: https://github.com/pgautoupgrade/docker-pgautoupgrade#error-message-when-mounting-data-to-varlibpostgresqldata-on-postgres-v18
    image: pgautoupgrade/pgautoupgrade:18-alpine
    env_file: /opt/redash/env
    volumes:
      - /opt/redash/postgres-data:/var/lib/postgresql
    restart: unless-stopped
  nginx:
    image: redash/nginx:latest
    ports:
      - "80:80"
    depends_on:
      - server
    links:
      - server:redash
    restart: always
  worker:
    <<: *redash-service
    command: worker
    environment:
      QUEUES: "periodic,emails,default"
      WORKERS_COUNT: 1
